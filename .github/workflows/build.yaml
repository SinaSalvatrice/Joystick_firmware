name: Build Firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYBOARD_NAME: joystick_pad
      KEYMAP_NAME: default
      QMK_HOME: ${{ github.workspace }}/qmk_firmware

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QMK CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install qmk

      - name: Set up QMK dependencies
        shell: bash
        run: qmk setup -y qmk/qmk_firmware -H "$QMK_HOME"

      - name: Stage keyboard into QMK tree
        shell: bash
        run: |
          rm -rf "$QMK_HOME/keyboards/$KEYBOARD_NAME"
          mkdir -p "$QMK_HOME/keyboards/$KEYBOARD_NAME"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'artifacts' \
            --exclude 'qmk_firmware' \
            ./ "$QMK_HOME/keyboards/$KEYBOARD_NAME/"

      - name: Build firmware
        shell: bash
        run: |
          cd "$QMK_HOME"
          qmk compile -kb "$KEYBOARD_NAME" -km "$KEYMAP_NAME"

      - name: Collect firmware artifacts
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p artifacts

          # This repo is configured for RP2040, so the primary firmware artifact is
          # expected to be a .uf2. Hex/bin files are also collected as a fallback.
          for pattern in \
            "$QMK_HOME"/*.uf2 \
            "$QMK_HOME"/.build/*.uf2 \
            "$QMK_HOME"/*.hex \
            "$QMK_HOME"/.build/*.hex \
            "$QMK_HOME"/*.bin \
            "$QMK_HOME"/.build/*.bin; do
            for file in $pattern; do
              cp "$file" artifacts/
            done
          done

          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joystick-firmware
          path: artifacts/*
          if-no-files-found: error