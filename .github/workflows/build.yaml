name: Build Firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QMK CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install qmk

      - name: Set up QMK dependencies
        shell: bash
        run: qmk setup -y qmk/qmk_firmware

      - name: Build firmware
        shell: bash
        run: qmk compile -km default

      - name: Collect firmware artifacts
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p artifacts

          # This repo currently targets atmega32u4 + atmel-dfu, which produces a
          # .hex firmware. If the keyboard is later moved to a UF2-capable target,
          # the generated .uf2 will be collected automatically as well.
          for pattern in *.uf2 .build/*.uf2 *.hex .build/*.hex *.bin .build/*.bin; do
            for file in $pattern; do
              cp "$file" artifacts/
            done
          done

          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joystick-firmware
          path: artifacts/*
          if-no-files-found: error